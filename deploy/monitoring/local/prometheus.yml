# Local development only: scrapes the backend running on this machine
# (python main.py in WSL, port 8000). No METRICS_TOKEN locally, so no auth.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

# The production alert rules. Firing alerts go to the local Alertmanager,
# whose e-mails end up in Mailpit (http://localhost:8025), not in any inbox.
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: call-intelligence-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
