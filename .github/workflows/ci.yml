name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3.12: the telephony audio path uses the stdlib audioop module,
      # which Python 3.13 removed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-api.txt
            backend/requirements-dev.txt

      # API runtime + test tools only. The pyannote/torch/CUDA stack
      # (requirements-diarization.txt) is not needed: the diarization tests
      # fake it.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check that every module compiles
        run: python -m compileall -q app alembic main.py

      - name: Check that the application imports
        run: python -c "import app.api.app_factory, app.api.wiring, app.composition.database"

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # tsc -b (type check) followed by the production Vite build.
      - name: Type check and build
        run: npm run build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the local and production compose files
        run: |
          docker compose -f docker-compose.yml --env-file .env.example config --quiet
          # env_file in the production stack points at deploy/.env.production.
          cp deploy/.env.production.example deploy/.env.production
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production config --quiet
          docker compose -f deploy/monitoring/local/docker-compose.yml config --quiet

  # Read-only checks in throwaway containers: nothing is scraped and no
  # e-mail is sent.
  monitoring:
    name: Monitoring config (Prometheus, Alertmanager)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/monitoring
    steps:
      - uses: actions/checkout@v4

      # Production and local prometheus.yml, each with the alert rules.
      - name: Check the Prometheus configs and alert rules
        run: |
          for config in prometheus/prometheus.yml local/prometheus.yml; do
            echo "== $config"
            docker run --rm --entrypoint /bin/sh \
              -v "$PWD/$config:/etc/prometheus/prometheus.yml:ro" \
              -v "$PWD/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
              prom/prometheus:v2.53.2 \
              -c 'touch /tmp/metrics_token && promtool check config /etc/prometheus/prometheus.yml'
          done

      # Renders alertmanager.yml and the e-mail template the way the container
      # does at start-up, then runs amtool check-config and renders each
      # template with sample data (entrypoint.sh --check).
      - name: Check the Alertmanager config and e-mail template
        run: |
          check() {
            docker run --rm --entrypoint /bin/sh "$@" \
              -v "$PWD/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.template.yml:ro" \
              -v "$PWD/alertmanager/templates:/etc/alertmanager/templates:ro" \
              -v "$PWD/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro" \
              prom/alertmanager:v0.27.0 /etc/alertmanager/entrypoint.sh --check
          }
          echo "== production settings"
          check -e ALERT_EMAIL_TO=oncall@example.com -e SMTP_SMARTHOST=smtp.example.com:587 \
            -e SMTP_USERNAME=alerts@example.com -e GRAFANA_URL=https://grafana.example.com
          echo "== local (Mailpit) settings"
          check -e ALERT_EMAIL_TO=oncall@call-intelligence.test -e SMTP_SMARTHOST=mailpit:1025 \
            -e SMTP_REQUIRE_TLS=false
