# Rendered by the nginx image at startup (envsubst fills ${API_UPSTREAM}).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;

    # API, live-call and telephony WebSockets.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Media streams stay open for the whole phone call.
        proxy_read_timeout 3h;
        proxy_send_timeout 3h;
    }

    # Probes for whatever sits in front of this container.
    location = /health/ready {
        proxy_pass ${API_UPSTREAM};
    }

    # /metrics is deliberately not exposed publicly; scrape the backend directly.

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
